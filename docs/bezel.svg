<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="-apple-system,BlinkMacSystemFont,SF Pro Text,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2233"/>
      <stop offset="45%" stop-color="#2a2340"/>
      <stop offset="100%" stop-color="#141824"/>
    </linearGradient>
    <linearGradient id="hud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3e" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#232326" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="appicon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#63b8ff"/>
      <stop offset="100%" stop-color="#2b6fd6"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22252d" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#191b21" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="screen"><rect x="0" y="0" width="880" height="400" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#screen)">
    <rect width="880" height="400" fill="url(#wall)"/>
    <!-- wallpaper glow -->
    <circle cx="200" cy="330" r="220" fill="#4b3f7a" opacity="0.28"/>
    <circle cx="720" cy="90" r="180" fill="#1f5c78" opacity="0.22"/>

    <!-- menu bar -->
    <rect x="0" y="0" width="880" height="26" fill="#0e1017" opacity="0.62"/>
    <path d="M18 8 a5 5 0 0 1 5 -5 a5 5 0 0 1 5 5 v8 h-10 z" fill="#e6edf3" opacity="0.85"/>
    <text x="44" y="17" font-size="11.5" font-weight="600" fill="#e6edf3" opacity="0.9">Safari</text>
    <text x="88" y="17" font-size="11.5" fill="#e6edf3" opacity="0.55">File   Edit   View   History</text>
    <text x="862" y="17" font-size="11.5" fill="#e6edf3" opacity="0.7" text-anchor="end">Wed 6 Aug  10:42</text>

    <!-- source window, dimmed behind -->
    <g filter="url(#soft)" opacity="0.95">
      <rect x="60" y="120" width="430" height="228" rx="11" fill="url(#win)" stroke="#3a4050" stroke-width="1"/>
      <rect x="60" y="120" width="430" height="34" rx="11" fill="#2b2f3a" opacity="0.9"/>
      <rect x="60" y="144" width="430" height="10" fill="#2b2f3a" opacity="0.9"/>
      <circle cx="80" cy="137" r="5" fill="#ff5f57"/>
      <circle cx="98" cy="137" r="5" fill="#febc2e"/>
      <circle cx="116" cy="137" r="5" fill="#28c840"/>
      <text x="275" y="141" font-size="11" fill="#8a93a6" text-anchor="middle">chakradharv.dev</text>

      <g font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="12">
        <text x="82" y="182" fill="#7d8899">Clone the repo and run:</text>
        <!-- selection highlight -->
        <rect x="78" y="196" width="330" height="20" rx="4" fill="#4f8cff" opacity="0.38"/>
        <text x="82" y="211" fill="#e6edf3">git clone github.com/chakri192/minimal-…</text>
        <text x="82" y="240" fill="#7d8899">then:</text>
        <text x="82" y="262" fill="#8a93a6">./install.sh</text>
      </g>
      <!-- cursor -->
      <path d="M362 214 l0 17 l4.5 -4.2 l3 6.6 l3.4 -1.6 l-3 -6.4 l6 -0.4 z" fill="#ffffff" stroke="#111" stroke-width="0.8"/>
      <text x="82" y="316" font-size="11" fill="#5d6675" font-family="SFMono-Regular,Menlo,Consolas,monospace">⌘C</text>
      <rect x="104" y="304" width="86" height="16" rx="8" fill="#4f8cff" opacity="0.16"/>
      <text x="147" y="316" font-size="10" fill="#7fb0ff" text-anchor="middle">copied</text>
    </g>

    <!-- motion cue: copy travels to the bezel -->
    <path d="M470 210 C 540 205, 545 130, 566 105" stroke="#7fb0ff" stroke-width="1.6" stroke-dasharray="4 5" fill="none" opacity="0.5"/>
    <circle cx="566" cy="105" r="2.6" fill="#7fb0ff" opacity="0.8"/>

    <!-- the bezel: 300x56, 16pt from the right, below the menu bar -->
    <g filter="url(#soft)">
      <rect x="564" y="36" width="300" height="56" rx="14" fill="url(#hud)"/>
      <rect x="564" y="36" width="300" height="56" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>

      <!-- frontmost app icon -->
      <rect x="578" y="50" width="28" height="28" rx="7" fill="url(#appicon)"/>
      <circle cx="592" cy="64" r="9.5" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.4"/>
      <path d="M596.5 59.5 l-3 6.2 l-6.2 3 l3 -6.2 z" fill="#ffffff" opacity="0.9"/>

      <text x="616" y="63" font-size="14" font-weight="500" fill="#ffffff">git clone github.com/chakri192/mi…</text>
      <text x="616" y="79" font-size="11" fill="#ffffff" fill-opacity="0.6">Safari</text>
    </g>

    <!-- timing annotation -->
    <g font-size="10.5" fill="#9aa4b8" font-family="SFMono-Regular,Menlo,Consolas,monospace">
      <line x1="564" y1="104" x2="864" y2="104" stroke="#5d6675" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="700" y="121" text-anchor="middle">0.18s in · 1.0s hold · 0.18s out · never clickable</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="879" height="399" rx="10" fill="none" stroke="#3a4050" stroke-width="1"/>
</svg>
