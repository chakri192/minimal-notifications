<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto">
      <path d="M0,0 L7.5,3 L0,6 z" fill="#6b7688"/>
    </marker>
    <marker id="arwg" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto">
      <path d="M0,0 L7.5,3 L0,6 z" fill="#7ddc8b"/>
    </marker>
    <marker id="arwr" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto">
      <path d="M0,0 L7.5,3 L0,6 z" fill="#f2707c"/>
    </marker>
  </defs>

  <rect width="880" height="430" rx="10" fill="#0b0d11"/>
  <rect x="0.5" y="0.5" width="879" height="429" rx="10" fill="none" stroke="#2b313d" stroke-width="1"/>

  <text x="32" y="40" font-size="13" font-weight="700" fill="#8a9bb4" letter-spacing="1.4">TWO PROCESSES, ONE PAUSE SWITCH</text>

  <!-- ── source: the pasteboard ── -->
  <rect x="32" y="64" width="176" height="112" rx="9" fill="#12151b" stroke="#39414f" stroke-width="1.2"/>
  <text x="120" y="90" font-size="12" font-weight="700" fill="#e6edf3" text-anchor="middle">macOS pasteboard</text>
  <text x="120" y="112" font-size="10.5" font-family="SFMono-Regular,Menlo,monospace" fill="#5fd0de" text-anchor="middle">NSPasteboard.general</text>
  <text x="120" y="130" font-size="10.5" font-family="SFMono-Regular,Menlo,monospace" fill="#7d8899" text-anchor="middle">.changeCount</text>
  <line x1="52" y1="142" x2="188" y2="142" stroke="#2b313d"/>
  <text x="120" y="162" font-size="10.5" font-family="SFMono-Regular,Menlo,monospace" fill="#7d8899" text-anchor="middle">pbpaste | md5</text>

  <!-- ── the two watchers ── -->
  <!-- bezel -->
  <rect x="272" y="52" width="212" height="130" rx="9" fill="#12151b" stroke="#5fd0de" stroke-width="1.3"/>
  <rect x="286" y="44" width="98" height="16" fill="#0b0d11"/>
  <text x="294" y="56" font-size="11" font-weight="700" fill="#5fd0de">transient-bezel</text>
  <text x="292" y="84" font-size="11" fill="#c2cad6">Swift · AppKit · ~250 LOC</text>
  <text x="292" y="105" font-size="10.5" font-family="SFMono-Regular,Menlo,monospace" fill="#7d8899">Timer, every 0.35s</text>
  <text x="292" y="123" font-size="10.5" font-family="SFMono-Regular,Menlo,monospace" fill="#7d8899">diff changeCount</text>
  <text x="292" y="145" font-size="10.5" fill="#8a9bb4">reads file URLs → text → image</text>
  <text x="292" y="164" font-size="10.5" fill="#8a9bb4">grabs frontmostApplication</text>

  <!-- whisper -->
  <rect x="272" y="216" width="212" height="112" rx="9" fill="#12151b" stroke="#f0b866" stroke-width="1.3"/>
  <rect x="286" y="208" width="94" height="16" fill="#0b0d11"/>
  <text x="294" y="220" font-size="11" font-weight="700" fill="#f0b866">audio-whisper</text>
  <text x="292" y="248" font-size="11" fill="#c2cad6">Bash · zero deps · ~50 LOC</text>
  <text x="292" y="269" font-size="10.5" font-family="SFMono-Regular,Menlo,monospace" fill="#7d8899">while true; sleep 0.4</text>
  <text x="292" y="287" font-size="10.5" font-family="SFMono-Regular,Menlo,monospace" fill="#7d8899">diff md5 hash</text>
  <text x="292" y="309" font-size="10.5" fill="#8a9bb4">skips the first tick after start</text>

  <line x1="208" y1="104" x2="266" y2="104" stroke="#6b7688" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="208" y1="150" x2="266" y2="262" stroke="#6b7688" stroke-width="1.4" marker-end="url(#arw)"/>

  <!-- ── the pause gate ── -->
  <path d="M596 190 l58 34 l-58 34 l-58 -34 z" fill="#12151b" stroke="#f2707c" stroke-width="1.3"/>
  <text x="596" y="219" font-size="11" font-weight="700" fill="#e6edf3" text-anchor="middle">paused?</text>
  <text x="596" y="234" font-size="9.5" font-family="SFMono-Regular,Menlo,monospace" fill="#7d8899" text-anchor="middle">flag file exists</text>

  <line x1="484" y1="117" x2="556" y2="205" stroke="#6b7688" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="484" y1="272" x2="556" y2="243" stroke="#6b7688" stroke-width="1.4" marker-end="url(#arw)"/>

  <text x="516" y="152" font-size="10" fill="#7d8899" text-anchor="middle">changed</text>
  <text x="516" y="288" font-size="10" fill="#7d8899" text-anchor="middle">changed</text>

  <!-- yes → swallow -->
  <path d="M596 258 L596 316" stroke="#f2707c" stroke-width="1.4" marker-end="url(#arwr)" fill="none"/>
  <text x="606" y="288" font-size="10" font-weight="700" fill="#f2707c">yes</text>
  <rect x="512" y="320" width="168" height="48" rx="8" fill="#12151b" stroke="#4a3138" stroke-width="1.2"/>
  <text x="596" y="341" font-size="11" font-weight="600" fill="#f2707c" text-anchor="middle">swallowed, silently</text>
  <text x="596" y="358" font-size="9.5" fill="#7d8899" text-anchor="middle">processes keep running</text>

  <!-- no → outputs -->
  <path d="M654 224 L704 224" stroke="#7ddc8b" stroke-width="1.4" marker-end="url(#arwg)" fill="none"/>
  <text x="676" y="216" font-size="10" font-weight="700" fill="#7ddc8b" text-anchor="middle">no</text>

  <path d="M690 224 C 706 224, 706 118, 716 118" stroke="#7ddc8b" stroke-width="1.4" fill="none" marker-end="url(#arwg)"/>
  <path d="M690 224 C 706 224, 706 300, 716 300" stroke="#7ddc8b" stroke-width="1.4" fill="none" marker-end="url(#arwg)"/>

  <rect x="720" y="88" width="128" height="62" rx="8" fill="#12151b" stroke="#39414f" stroke-width="1.2"/>
  <text x="784" y="110" font-size="11" font-weight="700" fill="#e6edf3" text-anchor="middle">NSPanel bezel</text>
  <text x="784" y="126" font-size="9.5" font-family="SFMono-Regular,Menlo,monospace" fill="#5fd0de" text-anchor="middle">.hudWindow blur</text>
  <text x="784" y="141" font-size="9.5" font-family="SFMono-Regular,Menlo,monospace" fill="#7d8899" text-anchor="middle">.screenSaver level</text>

  <rect x="720" y="270" width="128" height="62" rx="8" fill="#12151b" stroke="#39414f" stroke-width="1.2"/>
  <text x="784" y="292" font-size="11" font-weight="700" fill="#e6edf3" text-anchor="middle">afplay</text>
  <text x="784" y="308" font-size="9.5" font-family="SFMono-Regular,Menlo,monospace" fill="#f0b866" text-anchor="middle">Morse.aiff @ 0.15</text>
  <text x="784" y="323" font-size="9.5" font-family="SFMono-Regular,Menlo,monospace" fill="#7d8899" text-anchor="middle">backgrounded</text>

  <!-- footer: launchd + toggle -->
  <line x1="32" y1="386" x2="848" y2="386" stroke="#2b313d"/>
  <text x="32" y="410" font-size="10.5" font-family="SFMono-Regular,Menlo,monospace" fill="#7d8899">launchd  KeepAlive · RunAtLoad — both agents survive logout, crash, and reboot</text>
  <text x="848" y="410" font-size="10.5" font-family="SFMono-Regular,Menlo,monospace" fill="#f2707c" text-anchor="end">./toggle.sh  flips the flag file</text>
</svg>
